name: Firmware

on:
  push:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - ".github/workflows/firmware.yml"

jobs:
  host-tests:
    name: Host unit tests (rwp, audio_pipeline, tools)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run rwp host tests
        run: make -C firmware/components/rwp/test_host test

      - name: Run audio_pipeline host tests
        run: make -C firmware/components/audio_pipeline/test_host test

      - name: rwp_peer.py self-test
        run: python3 tools/rwp_peer.py selftest

      - name: Host simulator (floor + voice over lossy channel)
        run: make -C firmware/sim run

  build:
    name: ESP-IDF build (esp32s3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.4
          target: esp32s3
          path: firmware
          command: idf.py build
