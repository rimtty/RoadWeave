name: Firmware

# GitHub-hosted runners only: compile and run host/loopback tests.
# USB flash/monitor, I2S audio, and Wi-Fi/HaLow hardware benchmarks run locally.

on:
  push:
    paths:
      - "firmware/**"
      - "tools/**"
      - "!firmware/**/*.md"
      - "!tools/**/*.md"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "tools/**"
      - "!firmware/**/*.md"
      - "!tools/**/*.md"
      - ".github/workflows/firmware.yml"

jobs:
  host-tests:
    name: Host tests (no hardware)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run rwp host tests
        run: make -C firmware/components/rwp/test_host test

      - name: Run audio_pipeline host tests
        run: make -C firmware/components/audio_pipeline/test_host test

      - name: Run position host tests
        run: make -C firmware/components/position/test_host test

      - name: Python peer tests (codec and local UDP loopback)
        run: python3 -B -m unittest discover -s tools -p test_rwp_peer.py -v

      - name: Host simulator (floor + voice over lossy channel)
        run: make -C firmware/sim run

  build:
    name: ESP-IDF build (esp32s3, compile only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Fetch pinned Opus source
        run: firmware/components/opus/fetch-upstream.sh

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.4
          target: esp32s3
          path: firmware
          command: idf.py build
